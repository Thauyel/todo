<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="todo">
<title>todo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>todo</h1>
      <span class="sync" id="sync" title="synced" aria-live="polite"><i></i><span id="sync-text">synced</span></span>
    </div>
    <div class="date" id="date"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Lists"></nav>

  <form class="add" id="add" autocomplete="off">
    <input id="input" type="text" maxlength="500" enterkeyhint="done"
           placeholder="add a task" aria-label="New task">
    <button type="submit" id="add-btn" aria-label="Add" disabled>add</button>
  </form>

  <ul class="list" id="active" aria-label="Open tasks"></ul>
  <p class="empty" id="empty" hidden>nothing here</p>

  <section class="done" id="done-wrap" hidden>
    <div class="done-head">
      <button type="button" class="link" id="done-toggle" aria-expanded="false">done · <span id="done-count">0</span></button>
      <button type="button" class="link danger" id="clear-done">clear</button>
    </div>
    <ul class="list" id="done" hidden aria-label="Completed tasks"></ul>
  </section>

  <footer class="help">
    <span class="kb">enter add</span><span>tap text edit</span><span>tap dot priority</span>
    <span>drag ⋮⋮ reorder · onto a tab to move</span><span>!h / !l priority</span>
    <span>paste lines = many</span><span class="kb">n new · ctrl+z undo</span>
  </footer>
</div>

<div class="toast" id="toast" hidden><span id="toast-text"></span><button type="button" id="toast-undo">undo</button></div>

<script src="app.js"></script>
</body>
</html>
